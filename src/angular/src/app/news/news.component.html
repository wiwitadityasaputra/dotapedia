<div class="nk-main">
    <div class="nk-gap-1"></div>
    <div class="container">
        <h3 class="nk-decorated-h-3"><span><span class="text-main-1">Latest </span>News</span></h3>
    </div>
    <div class="nk-gap-1"></div>
</div>
<div class="nk-main">
    <div class="container">
        <div class="nk-blog-fullwidth dp-blog-fullwidth">
            <div class="nk-blog-post dp-blog-post" *ngFor="let n of news">
                <a target="_blank" [href]="n.url" class="nk-post-img dp-post-img">
                    <img [src]="n.urlToImage"
                        onerror="this.src='assets/images/post-1-fw.jpg'" />
                </a>
                <div class="nk-gap-2"></div>
                <div class="row vertical-gap">
                    <div class="col-md-12 col-lg-12 dp-row-news-title">
                        <h2 class="nk-post-title h4 dp-post-title">
                            <a target="_blank" [href]="n.url">
                                {{n.title}}
                            </a>
                        </h2>
                    </div>
                    <div class="col-md-12 col-lg-12 row dp-row-news-content">
                        <div class="col-md-10 col-lg-10">
                            <div class="nk-post-text dp-post-text">
                                <p>
                                    {{n.content}}
                                    <a target="_blank" [href]="n.url" class="nk-btn nk-btn-rounded nk-btn-color-dark-3 nk-btn-hover-color-main-1">Read More</a>
                                </p>
                            </div>
                        </div>
                        <div class="col-md-2 col-lg-2">
                            <div class="nk-post-by dp-post-by">
                                by <a target="_blank" [href]="n.url">{{n.author}}</a>
                                <br>{{n.publishedAt | date: 'mediumDate'}}<br>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
